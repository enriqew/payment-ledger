version: 2

sources:
  - name: silver
    description: >
      Deduplicated and typed, written by the Spark jobs in `jobs/`. dbt reads silver and owns
      gold; nothing here writes back into a layer a streaming job maintains.
    # A variable rather than a constant because phase 5 runs the same project against a namespace
    # of its own per chaos scenario, so a damaged run and the run it is compared against can sit
    # side by side in the catalog instead of overwriting each other. Unset, it is plain silver.
    schema: "{{ var('silver_schema', 'silver') }}"
    tables:
      - name: balance_transaction_list
        description: >
          What `/v1/balance_transactions` returns. Every posting in the ledger comes off this,
          because a webhook carries `balance_transaction` as an id and not as an object, so the
          fee, the net and `available_on` are not in the event stream at all.
        columns:
          - name: balance_transaction_id
            tests: [unique, not_null]
          - name: net
            tests: [not_null]
          - name: currency
            tests: [not_null]

      - name: reported_balance
        description: >
          What the processor says its balance was, per day and per currency, computed without
          consulting the pipeline. This is the anchor, and the whole reason it is worth anything
          is that it is the one table here the ledger did not produce.
        columns:
          - name: as_of_date
            tests: [not_null]
          - name: available
            tests: [not_null]
          - name: pending
            tests: [not_null]

      - name: charges
        description: One row per charge, from its latest event by event time.
      - name: refunds
      - name: disputes

      - name: balance_transactions
        description: >
          The balance transactions the event stream carried *expanded*, which only dispute
          payloads do. Small, and the only place the stream states an amount of settled money
          rather than an id, which is what makes it worth comparing against the list.
        columns:
          - name: balance_transaction_id
            tests: [unique, not_null]
