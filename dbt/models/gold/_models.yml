version: 2

models:
  - name: ledger_postings
    description: >
      Double-entry postings derived from balance transactions. Two entries per transaction:
      recognition at `created` and availability at `available_on`. An entry is a set of postings
      that sums to zero per currency, which is what makes the first invariant checkable.
    columns:
      - name: posting_id
        description: entry plus account, which is unique because an account appears once per entry
        tests: [unique, not_null]
      - name: entry_id
        tests: [not_null]
      - name: entry_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["recognition", "availability"]
      - name: account
        description: >
          The chart of accounts, closed on purpose. A reporting category nobody has modelled posts
          to `expense:unclassified`, which is not in this list, so an unmodelled category fails the
          build instead of quietly leaving money unaccounted for.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "asset:balance_pending"
                  - "asset:balance_available"
                  - "asset:bank"
                  - "revenue:gross_sales"
                  - "contra_revenue:refunds"
                  - "expense:processing_fees"
                  - "expense:disputes"
      - name: amount
        description: signed, in the settlement currency's minor unit, integer at every layer
        tests: [not_null]
      - name: currency
        tests: [not_null]
      - name: balance_transaction_id
        tests: [not_null]

  - name: account_balances
    description: The trial balance, per account and currency, with the signs double entry uses.
    columns:
      - name: account
        tests: [not_null]
      - name: balance
        tests: [not_null]

  - name: daily_close
    description: >
      What the books say for each day, on a full date spine. This is the side phase 4 weighs
      against the balance the processor reports.
    columns:
      - name: close_date
        tests: [not_null]
      - name: currency
        tests: [not_null]
      - name: balance_pending
        tests: [not_null]
      - name: balance_available
        tests: [not_null]

  - name: reconciliation
    description: >
      The ledger weighed against the balance the processor reports, per day and per currency. The
      check the double-entry invariants cannot make: post a transaction twice and the books stay
      internally consistent and are wrong by exactly one transaction. No tolerance is granted,
      because both sides are integers and a tolerance is only somewhere for a discrepancy to hide.
    columns:
      - name: close_date
        tests: [not_null]
      - name: currency
        tests: [not_null]
      - name: unexplained_difference
        description: the difference left once the itemised causes are taken out
        tests: [not_null]

  - name: reconciliation_items
    description: >
      For every day the reconciliation cannot explain, the balance transactions that touched it.
      Empty on a healthy run, which is the statement that every day agreed rather than a table
      nobody finished.
    columns:
      - name: balance_transaction_id
        tests: [not_null]
