# Local stack. Everything is single-node and disposable: the point is a full run that costs
# nothing, not a production topology.
#
# Services arrive with the phase that needs them. Kafka, MinIO and the Iceberg REST catalog are
# here now (phases 0 and 1), and so is Spark, which arrived with the streaming job. Airflow lands
# with the chaos suite in phase 5, pinned when there is a job to run against it rather than guessed
# at in advance.

name: payment-ledger

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: pl-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      # Two advertised listeners because containers and the host reach the broker by different
      # names. Getting this wrong is the usual reason a host-side producer hangs on metadata.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: payment-ledger-local-cluster
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Creates the one topic the pipeline uses, rather than relying on auto-creation, which would
  # hide a typo in a topic name as a silently empty stream.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: pl-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    # A one-item list holding a literal block, which is the only shape that survives intact.
    # A string `command:` is word-split by Compose, so the script would reach `sh -c` as argv
    # rather than as one script, and a folded `>` block turns the newlines into spaces.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
          --create --if-not-exists --topic stripe.events.raw \
          --partitions 6 --replication-factor 1 \
          --config cleanup.policy=delete --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: pl-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: pl-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/warehouse
        mc ls local
    restart: "no"

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    container_name: pl-iceberg-rest
    ports:
      - "8181:8181"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1

  # The namespaces the catalog needs, created the same way the topic and the bucket are: on
  # purpose, so a typo is an error rather than a silently empty layer.
  #
  # `default` is in the list for an unglamorous reason. PyHive issues `USE default` when it opens
  # a JDBC session, so dbt cannot connect to a catalog that has no such namespace, and dbt-spark
  # exposes no way to change it. It stays empty.
  iceberg-init:
    image: curlimages/curl:8.11.0
    container_name: pl-iceberg-init
    depends_on:
      iceberg-rest:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for ns in default bronze silver gold; do
          code=$$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://iceberg-rest:8181/v1/namespaces -H 'Content-Type: application/json' -d "{\"namespace\": [\"$$ns\"]}")
          echo "$$ns $$code"
        done
    restart: "no"

  # Arrives with phase 1, the first phase with a job to run against it. Not a long-lived
  # service: `make bronze` runs one submit and the container goes away, which is why it sits
  # behind a profile and does not start with `make up`.
  spark:
    build:
      context: ..
      dockerfile: docker/spark.Dockerfile
    image: payment-ledger/spark:3.5.7-iceberg1.10.1
    profiles: ["jobs"]
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      SPARK_CONF_DIR: /opt/payment-ledger/conf
    working_dir: /opt/payment-ledger
    entrypoint: ["/opt/spark/bin/spark-submit"]
    volumes:
      - ../jobs:/opt/payment-ledger/jobs:ro
      - ../conf:/opt/payment-ledger/conf:ro
      # A generated run, for the one input that does not arrive as a webhook: the balance
      # transaction list is a query result, and the job that loads it reads the file the
      # generator wrote.
      - ../data:/opt/payment-ledger/data:ro
      # The one path a job may write to. Exporting is the only thing here that has to put a file
      # back in the tree, so it gets a directory of its own with an obvious name rather than the
      # tree becoming writable.
      - ../export:/opt/payment-ledger/export
      - spark-checkpoints:/opt/payment-ledger/checkpoints

  # Arrives with phase 3, because dbt speaks JDBC and Spark only speaks it through this. Long
  # lived, unlike the `spark` service: a `dbt build` opens a session, runs a few dozen statements
  # and closes it, and paying JVM startup for each of those would make the ledger feel like batch
  # for no reason.
  spark-thrift:
    build:
      context: ..
      dockerfile: docker/spark.Dockerfile
    image: payment-ledger/spark:3.5.7-iceberg1.10.1
    container_name: pl-spark-thrift
    profiles: ["jobs"]
    depends_on:
      minio:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
    ports:
      - "10000:10000"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      SPARK_CONF_DIR: /opt/payment-ledger/conf
    # Not /opt/payment-ledger, which is mounted read only: the thrift server writes a local derby
    # metastore for its own session catalog before it ever reaches the Iceberg one.
    working_dir: /tmp
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - "--class"
      - "org.apache.spark.sql.hive.thriftserver.HiveThriftServer2"
      - "--name"
      - "payment-ledger-thrift"
      - "spark-internal"
    volumes:
      - ../conf:/opt/payment-ledger/conf:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/10000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  dbt:
    build:
      context: ..
      dockerfile: docker/dbt.Dockerfile
    # Named rather than left to Compose, because Airflow starts this image itself and a task that
    # guessed the name from the project would break the moment the directory was renamed.
    image: payment-ledger/dbt:1.11.0
    profiles: ["jobs"]
    depends_on:
      spark-thrift:
        condition: service_healthy
    volumes:
      - ../dbt:/opt/payment-ledger/dbt

  # Arrives with phase 5, the first phase with something worth scheduling. Single node, SQLite and
  # a sequential executor: the DAG starts containers that each take a whole machine for a minute,
  # so an executor that could run two of them at once would only make them fight.
  #
  # It starts containers rather than running the work itself, which is why the Docker socket is
  # here. That also means the paths it hands the daemon are *host* paths, not paths inside this
  # container, so the repository's location on the host has to be passed in. There is no way around
  # it: a sibling container is started by the same daemon the host talks to, and that daemon knows
  # nothing about this container's filesystem.
  airflow:
    build:
      context: ..
      dockerfile: docker/airflow.Dockerfile
    image: payment-ledger/airflow:2.10.4
    container_name: pl-airflow
    profiles: ["orchestration"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # The DAG runs the working tree rather than an installed copy.
      PYTHONPATH: /opt/payment-ledger/src
      # The producer step runs inside this container, so the broker is reachable by service name
      # rather than through the port published to the host.
      KAFKA_BOOTSTRAP: kafka:19092
      # Where this repository lives on the *host*, which is what the daemon needs in order to bind
      # the working tree into a sibling container. Left empty rather than declared required with
      # `:?`, which fails the interpolation of the whole file: every `docker compose run` in the
      # project, for services that have nothing to do with Airflow, would stop working because a
      # variable for this one was unset. The DAG says so itself when it is missing.
      LEDGER_HOST_ROOT: ${LEDGER_HOST_ROOT:-}
      LEDGER_NETWORK: payment-ledger_default
    # Root because the socket is root owned on a stock Docker Desktop install, and a scheduler that
    # cannot reach the daemon has nothing to schedule.
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../airflow/dags:/opt/airflow/dags:ro
      # The whole tree, writable, because a scenario writes its inputs and its verdict into data/
      # and reads the ledger's own reset list out of the Makefile.
      - ..:/opt/payment-ledger
    command: ["standalone"]

volumes:
  kafka-data:
  minio-data:
  # The checkpoints are a volume so a rerun resumes from the offsets it left off at instead of
  # replaying the topic into bronze a second time. The connector jars used to need one too; they
  # are in the image now, so a run needs no network at all.
  spark-checkpoints:
