# Local stack. Everything is single-node and disposable: the point is a full run that costs
# nothing, not a production topology.
#
# Services arrive with the phase that needs them. Kafka, MinIO and the Iceberg REST catalog are
# here now (phases 0 and 1). Spark lands with the streaming jobs in phase 1 and Airflow with the
# chaos suite in phase 5, each pinned when there is a job to run against it rather than guessed
# at in advance.

name: payment-ledger

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: pl-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      # Two advertised listeners because containers and the host reach the broker by different
      # names. Getting this wrong is the usual reason a host-side producer hangs on metadata.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: payment-ledger-local-cluster
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Creates the one topic the pipeline uses, rather than relying on auto-creation, which would
  # hide a typo in a topic name as a silently empty stream.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: pl-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
         --create --if-not-exists --topic stripe.events.raw
         --partitions 6 --replication-factor 1
         --config cleanup.policy=delete --config retention.ms=604800000
       && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list"
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: pl-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: pl-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mc alias set local http://minio:9000 minioadmin minioadmin
       && mc mb --ignore-existing local/warehouse
       && mc ls local"
    restart: "no"

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.6.1
    container_name: pl-iceberg-rest
    ports:
      - "8181:8181"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1

volumes:
  kafka-data:
  minio-data:
