# Spark defaults for the local stack. The jobs in jobs/ carry no catalog or object store wiring
# of their own: where the lakehouse lives is deployment, and a job that hardcodes an endpoint is a
# job that can only ever run in one place.

spark.sql.extensions  org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# One catalog, `lakehouse`, holding bronze, silver and gold as namespaces. REST rather than a
# Hadoop catalog so the metadata pointer is a service and not a file in a bucket: that is what
# makes an atomic commit atomic, and it is the difference between snapshots you can restate from
# and snapshots you can lose a race against.
spark.sql.catalog.lakehouse                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type                  rest
spark.sql.catalog.lakehouse.uri                   http://iceberg-rest:8181
spark.sql.catalog.lakehouse.warehouse             s3://warehouse/
# ResolvingFileIO rather than S3FileIO directly, because Iceberg's streaming source writes its
# initial offset into the Spark checkpoint with the table's own FileIO, and that checkpoint is a
# local path. S3FileIO refuses a file: URI outright ("Invalid S3 URI, cannot determine scheme"),
# which fails the silver stream before its first batch. Resolving picks S3FileIO for s3:// and the
# Hadoop one for everything else, so both writes land where they should.
spark.sql.catalog.lakehouse.io-impl               org.apache.iceberg.io.ResolvingFileIO
spark.sql.catalog.lakehouse.s3.endpoint           http://minio:9000
spark.sql.catalog.lakehouse.s3.path-style-access  true
spark.sql.defaultCatalog                          lakehouse

# The catalog caches table metadata for thirty seconds, and every job here writes a table and then
# reads it back to report on what it wrote. With the cache on, that read returns the snapshot from
# before the write: silver reported zero rows into a table that already held four thousand. A job
# that cannot see its own commit is worse than a job that refetches metadata.
spark.sql.catalog.lakehouse.cache-enabled         false

# Every day boundary in this project is a UTC day, on both sides of the reconciliation. Left to
# the default, a timestamp becomes a date in whatever timezone the machine happens to be in, which
# moves every transaction near midnight into the day before or after and makes a daily close mean
# something different on two laptops.
spark.sql.session.timeZone  UTC

# Single node, a handful of megabytes of events. The default 200 shuffle partitions would write
# 200 mostly empty files per commit and make the small-file problem the first thing you see.
spark.sql.shuffle.partitions  6

# The driver is the whole engine in local mode, and the default gigabyte is enough for a run of a
# few thousand transactions and not for one of a few million: the silver merge scans its source
# twice and holds the collapsed batch, so it spills to disk long before it fails, and spilling on
# a laptop is slower than the run deserves to be. A ceiling rather than a reservation, so a small
# run costs nothing for it being here.
spark.driver.memory  6g
