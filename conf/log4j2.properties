# Setting SPARK_CONF_DIR replaces the image's whole conf directory, log4j config included, so
# this file has to exist or every run buries its own output under Spark's INFO log.

rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n

# Structured Streaming reports each batch at INFO. It is the one thing worth reading during a run,
# so it is kept while everything else is quiet.
logger.streaming.name = org.apache.spark.sql.execution.streaming.MicroBatchExecution
logger.streaming.level = info

# Noise from the shaded AWS client talking to MinIO over plain http.
logger.awssdk.name = software.amazon.awssdk
logger.awssdk.level = error
